<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>遇見木子里 POS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
body { font-family:-apple-system; background:#f5f5f5; padding:10px; }

.tab { display:flex; }
.tab button { flex:1; padding:14px; border:none; }
.active { background:#333; color:#fff; }

.card { background:#fff; padding:12px; margin-top:10px; border-radius:12px; }

.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.item-btn {
    padding:25px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:#eee;
}

.order {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    gap:10px;
}

.order span{
    font-size:20px;
    font-weight:600;
    line-height:1.4;
    flex:1;
}

.order button{
    width:42px;
    height:42px;
    border:none;
    border-radius:10px;
    margin-left:4px;
    background:#333;
    color:#fff;
    font-size:20px;
    font-weight:bold;
}

input { width:100%; padding:12px; font-size:18px; }

.btn {
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#333;
    color:#fff;
}

h2 {
    font-family: "Noto Serif TC", "PingFang TC", serif;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 3px;
}

.order button{
    width:48px;
    height:48px;
    border:none;
    border-radius:12px;
    margin-left:8px;
    background:#333;
    color:#fff;
    font-size:22px;
    font-weight:bold;
}

.order span{
    font-size:28px;
    font-weight:600;
    line-height:1.5;
}

</style>

</head>

<body>
<h2>遇見木子里</h2>
<div class="tab">
<button id="tab1" class="active" onclick="show('sale')">出攤</button>
<button id="tab2" onclick="show('report')">日結</button>
<button id="tab3" onclick="show('history')">報表</button>
</div>

<!-- 出攤 -->
<div id="sale" class="card">

<h3>商品</h3>

<div class="grid">
<button class="item-btn" onclick="addToCart('琥珀油蔥糕',50)">琥珀油蔥糕<br>$50</button>
<button class="item-btn" onclick="addToCart('紅豆酥甜糕',50)">紅豆酥甜糕<br>$50</button>
<button class="item-btn" onclick="addToCart('項目三',50)">項目三</button>
<button class="item-btn" onclick="addToCart('項目四',50)">項目四</button>
</div>

<h3>本單</h3>
<div id="cart"></div>

<h3>本單金額：<span id="cartTotal">0</span></h3>

<button class="btn" onclick="checkout()">結帳</button>
<button class="btn" onclick="clearCart()" style="background:#999">取消本單</button>

<hr>

<h3>今日營收：<span id="dayTotal">0</span></h3>

</div>

<!-- 日結 -->
<div id="report" class="card" style="display:none">

<p>日期</p>
<input type="date" id="date">

<h3>食材成本（可多項）</h3>
<div id="foodList"></div>
<button class="btn" onclick="addFood()">＋新增食材</button>

<p>人事</p>
<input type="number" inputmode="numeric" id="staff">

<p>租金</p>
<input type="number" inputmode="numeric" id="rent">

<p>管銷</p>
<input type="number" inputmode="numeric" id="other">

<h3>食材總成本：<span id="foodTotal">0</span></h3>
<h3>營收：<span id="rev">0</span></h3>
<h3>最高KPI：<span id="kpi">0</span></h3>
<h3>差額：<span id="diff">0</span></h3>

<button class="btn" onclick="save()">日結存檔</button>

</div>

<!-- 報表 -->
<div id="history" class="card" style="display:none">
<h3>歷史紀錄</h3>
<div id="list"></div>
</div>

<script>
let cart = {};
let cartTotal = 0;
let dayTotal = 0;

function show(p){
    document.getElementById("sale").style.display = p==='sale'?'block':'none';
    document.getElementById("report").style.display = p==='report'?'block':'none';
    document.getElementById("history").style.display = p==='history'?'block':'none';

    document.getElementById("tab1").classList.toggle("active",p==='sale');
    document.getElementById("tab2").classList.toggle("active",p==='report');
    document.getElementById("tab3").classList.toggle("active",p==='history');
}

// 加入商品（預設+1）
function addToCart(name, price){
    if(!cart[name]){
        cart[name] = {qty:0, price:price};
    }
    cart[name].qty += 1;
    renderCart();
}

// 減少/增加
function changeQty(name, delta){
    cart[name].qty += delta;
    if(cart[name].qty <= 0){
        delete cart[name];
    }
    renderCart();
}

// 刪除單品
function removeItem(name){
    delete cart[name];
    renderCart();
}

// 渲染本單
function renderCart(){
    let html = "";
    cartTotal = 0;

    for(let k in cart){
        let item = cart[k];
        let sub = item.qty * item.price;
        cartTotal += sub;

        html += `
        <div class="order">
            <span>${k} x${item.qty} = $${sub}</span>
            <div>
                <button onclick="changeQty('${k}',-1)">-</button>
                <button onclick="changeQty('${k}',1)">+</button>
                <button onclick="removeItem('${k}')">刪</button>
            </div>
        </div>`;
    }

    if(html===""){
    html = "<p>尚未加入商品</p>";
}

document.getElementById("cart").innerHTML = html;
    document.getElementById("cartTotal").innerText = cartTotal;
}

// 清空本單
function clearCart(){
    cart = {};
    cartTotal = 0;
    renderCart();
}

// 結帳（才進營收）
function checkout(){
    if(cartTotal === 0){
        alert("沒有商品");
        return;
    }

    dayTotal += cartTotal;

    clearCart();
    document.getElementById("dayTotal").innerText = dayTotal;
    document.getElementById("rev").innerText = dayTotal;

    calcAll(); // 🔥 更新KPI
}

function addFood(){
    let id = Date.now();

    let html = `
    <div id="food-${id}" style="display:flex;gap:5px;margin-bottom:5px;">
        <input placeholder="品項">
        <input type="number" inputmode="numeric" placeholder="金額" oninput="calcAll()">
        <button onclick="removeFood(${id})">刪</button>
    </div>`;

    document.getElementById("foodList").innerHTML += html;
}

function removeFood(id){
    document.getElementById("food-"+id).remove();
    calcAll();
}

function calcFoodTotal(){
    let total = 0;

    document.querySelectorAll("#foodList input[type=number]").forEach(i=>{
        total += Number(i.value)||0;
    });

    document.getElementById("foodTotal").innerText = total;
    return total;
}

function calcAll(){
    let food = calcFoodTotal();
    let staffVal = Number(document.getElementById("staff").value)||0;
    let rentVal = Number(document.getElementById("rent").value)||0;
    let otherVal = Number(document.getElementById("other").value)||0;

    let kpis = [
        food ? food / 0.25 : 0,
        staffVal ? staffVal / 0.2 : 0,
        rentVal ? rentVal / 0.1 : 0,
        otherVal ? otherVal / 0.1 : 0
    ];

    let max = Math.max(...kpis);

    document.getElementById("kpi").innerText = Math.round(max);

    // 👉 差額（達標判斷）
    let diff = dayTotal - max;
    document.getElementById("diff").innerText = Math.round(diff);
}

document.addEventListener("input", calcAll);

document.getElementById("date").valueAsDate = new Date();

</script>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { 
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "moodzi-pos",
  authDomain: "moodzi-pos.firebaseapp.com",
  projectId: "moodzi-pos",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.save = async function(){
if(!document.getElementById("date").value){
    alert("請選擇日期");
    return;
}
    let d = {
        date: document.getElementById("date").value,
        revenue: dayTotal,
        kpi: document.getElementById("kpi").innerText
    };

    await addDoc(collection(db,"sales"), d);

    alert("已存雲端");

    load();

    show('history');
}

async function load(){

    const q = query(
        collection(db,"sales"),
        orderBy("date","desc")
    );

    let snap = await getDocs(q);

    let html = "";

    snap.forEach(doc=>{
        let d = doc.data();

        html += `
<div class="card" style="margin-top:10px;">
    <h3>${d.date}</h3>
    <p>營收：$${d.revenue}</p>
    <p>KPI：${d.kpi}</p>
</div>`;
    });

    document.getElementById("list").innerHTML = html;
}

load();
</script>

</body>
</html>
