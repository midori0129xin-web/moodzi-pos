<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遇見木子里 POS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#333333">
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif;
    background: #f6f1e8;
    color: #2a261f;
    padding: 10px;
    margin: 0;
}

h2 {
    font-family: "Noto Serif TC", "PingFang TC", serif;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 3px;
    margin: 10px 0 14px;
    color: #3b2c1d;
}

h3 {
    margin: 18px 0 10px;
}

.tab {
    display: flex;
    gap: 6px;
}

.tab button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #e3d8c7;
    color: #4a3a29;
    font-size: 17px;
    font-weight: 700;
}

.tab button.active {
    background: #6d4c2f;
    color: #fff;
}

.card {
    background: #fffaf2;
    padding: 12px;
    margin-top: 10px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(80, 55, 28, 0.08);
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.item-btn {
    min-height: 96px;
    padding: 18px 10px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: #f2dfbf;
    color: #3b2c1d;
    font-weight: 700;
}

.item-btn:nth-child(2) {
    background: #ead0d0;
    color: #4a2528;
}

.item-btn:nth-child(3) {
    background: #dce8d3;
    color: #283d24;
}

.item-btn:nth-child(4) {
    background: #d7e3e5;
    color: #243a40;
}

.order {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    gap: 10px;
    border-bottom: 1px solid #eadfce;
}

.order span {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.5;
    flex: 1;
}

.order-actions {
    display: flex;
    gap: 6px;
}

.order button,
.food-row button,
.danger-small {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 12px;
    background: #6d4c2f;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
}

.order button.remove,
.food-row button,
.danger-small {
    background: #a56a43;
    font-size: 16px;
}

input {
    box-sizing: border-box;
    width: 100%;
    padding: 12px;
    font-size: 18px;
    border: 1px solid #d8c7b2;
    border-radius: 10px;
    background: #fffdf8;
}

#date {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    display: block;
    -webkit-appearance: none;
    appearance: none;
    text-align: left;
}

@supports (-webkit-touch-callout: none) {
    #date {
        width: -webkit-fill-available;
    }
}

.btn {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #6d4c2f;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
}

.btn.secondary {
    background: #9b7a5b;
}

.price-toggle,
.payment-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 8px;
}

.price-toggle button,
.payment-toggle button {
    min-height: 54px;
    border: 2px solid #d8c7b2;
    border-radius: 12px;
    background: #fffdf8;
    color: #4a3a29;
    font-size: 18px;
    font-weight: 700;
}

.price-toggle button.active,
.payment-toggle button.active {
    background: #6d4c2f;
    border-color: #6d4c2f;
    color: #fff;
}

.fee-note {
    margin: 8px 0 0;
    color: #8a755f;
    font-size: 14px;
}

.summary-box {
    background: #f3eadc;
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 8px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid #e2d4c1;
    font-size: 18px;
    font-weight: 600;
}

.summary-row:last-child {
    border-bottom: none;
}

.last-order-actions,
.history-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}

.last-order-actions .btn,
.history-actions .btn {
    margin-top: 0;
}

.food-row {
    display: grid;
    grid-template-columns: 1fr 110px 48px;
    gap: 6px;
    margin-bottom: 8px;
    align-items: center;
}

.history-card {
    background: #f3eadc;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border-left: 5px solid #b98542;
}

.history-card h3 {
    margin-top: 0;
}

.empty {
    color: #8a755f;
}

@media (max-width: 430px) {
    .order {
        align-items: flex-start;
        flex-direction: column;
    }

    .order span {
        font-size: 22px;
    }

    .order-actions {
        width: 100%;
    }

    .order button {
        flex: 1;
    }
}
</style>
</head>

<body>
<h2>遇見木子里</h2>

<div class="tab">
    <button id="tab1" class="active" onclick="show('sale')">出攤</button>
    <button id="tab2" onclick="show('report')">日結</button>
    <button id="tab3" onclick="show('history')">報表</button>
</div>

<div id="sale" class="card">
    <h3>商品</h3>

    <h3>售價模式</h3>
    <div class="price-toggle">
        <button id="price50" class="active" onclick="setPriceMode(50)">$50</button>
        <button id="price60" onclick="setPriceMode(60)">$60</button>
    </div>

    <div id="productGrid" class="grid"></div>

    <h3>本單</h3>
    <div id="cart"></div>

    <h3>本單金額：$<span id="cartTotal">0</span></h3>

    <h3>收款方式</h3>
    <div class="payment-toggle">
        <button id="payCash" class="active" onclick="setPayment('cash')">現金</button>
        <button id="payElectronic" onclick="setPayment('electronic')">電子支付</button>
    </div>
    <p class="fee-note">電子支付會自動計算 3.15% 手續費</p>

    <button class="btn" onclick="checkout()">結帳</button>
    <button class="btn secondary" onclick="clearCart()">取消本單</button>

    <hr>

    <h3>今日營收：$<span id="dayTotal">0</span></h3>

    <h3>收款統計</h3>
    <div id="paymentSummary" class="summary-box"></div>

    <h3>今日商品銷售</h3>
    <div id="salesSummary" class="summary-box"></div>

    <h3>上一筆結帳</h3>
    <div id="lastOrder" class="summary-box"></div>
</div>

<div id="report" class="card" style="display:none">
    <p>日期</p>
    <input type="date" id="date">

    <h3>額外成本（可多項）</h3>
    <div id="foodList"></div>
    <button class="btn" onclick="addFood()">＋新增食材</button>

    <p>人事</p>
    <input type="number" inputmode="numeric" id="staff">

    <p>租金</p>
    <input type="number" inputmode="numeric" id="rent">

    <p>管銷</p>
    <input type="number" inputmode="numeric" id="other">

    <h3>商品成本：$<span id="productCostTotal">0</span></h3>
    <h3>額外成本：$<span id="foodTotal">0</span></h3>
    <h3>營收：$<span id="rev">0</span></h3>
    <h3>現金收入：$<span id="cashTotal">0</span></h3>
    <h3>電子支付：$<span id="electronicTotal">0</span></h3>
    <h3>電子支付手續費：$<span id="feeTotal">0</span></h3>
    <h3>扣手續費後收入：$<span id="netRevenue">0</span></h3>
    <h3>總成本：$<span id="totalCost">0</span></h3>
    <h3>所得：$<span id="profit">0</span></h3>
    <h3>最高KPI：$<span id="kpi">0</span></h3>
    <h3>差額：$<span id="diff">0</span></h3>

    <button class="btn" onclick="save()">日結存檔</button>
</div>

<div id="history" class="card" style="display:none">
    <h3>歷史紀錄</h3>
    <div id="list"></div>
</div>

<script>
const STORAGE_KEY = "moodzi-pos-sales";
const DAY_TOTAL_PREFIX = "moodzi-pos-day-total-";
const DAY_ORDERS_PREFIX = "moodzi-pos-orders-";
const ELECTRONIC_FEE_RATE = 0.0315;
const PRODUCT_COSTS = {
    "紅豆起酥年糕": 12.45,
    "黑糖起酥年糕": 12.23,
    "軟餅小糰子": 15.75,
    "綜合年糕": 12.34,
    "項目五": 0,
    "項目六": 0
};
const PRODUCTS = Object.keys(PRODUCT_COSTS);

let cart = {};
let cartTotal = 0;
let dayTotal = 0;
let selectedPayment = "cash";
let selectedPrice = 50;
let editingReportDate = "";

function getTodayString() {
    let date = new Date();
    let year = date.getFullYear();
    let month = String(date.getMonth() + 1).padStart(2, "0");
    let day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

function getTodayKey() {
    return `${DAY_TOTAL_PREFIX}${getTodayString()}`;
}

function getOrdersKey() {
    return `${DAY_ORDERS_PREFIX}${getTodayString()}`;
}

function money(value) {
    return Math.round(Number(value) || 0);
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function getProductCost(name) {
    return Number(PRODUCT_COSTS[name]) || 0;
}

function cloneCart(source) {
    let copy = {};
    for (let name in source) {
        copy[name] = {
            qty: Number(source[name].qty) || 0,
            price: Number(source[name].price) || 0,
            cost: Number.isFinite(Number(source[name].cost)) ? Number(source[name].cost) : getProductCost(name)
        };
    }
    return copy;
}

function getCartItemCount(items) {
    let count = 0;
    for (let name in items) {
        count += Number(items[name].qty) || 0;
    }
    return count;
}

function getOrderFee(order) {
    return order.paymentMethod === "electronic" ? money(order.total * ELECTRONIC_FEE_RATE) : 0;
}

function getPaymentLabel(method) {
    return method === "electronic" ? "電子支付" : "現金";
}

function show(p) {
    document.getElementById("sale").style.display = p === "sale" ? "block" : "none";
    document.getElementById("report").style.display = p === "report" ? "block" : "none";
    document.getElementById("history").style.display = p === "history" ? "block" : "none";

    document.getElementById("tab1").classList.toggle("active", p === "sale");
    document.getElementById("tab2").classList.toggle("active", p === "report");
    document.getElementById("tab3").classList.toggle("active", p === "history");

    if (p === "history") {
        load();
    }
}

function getReportStatsForDate(date) {
    if (!date || date === getTodayString()) {
        return getTodayStats();
    }

    let record = getSales().find(item => item.date === date);
    if (!record) {
        return {
            revenue: 0,
            cash: 0,
            electronic: 0,
            fee: 0,
            net: 0,
            productCost: 0,
            itemTotals: {},
            orders: []
        };
    }

    return {
        revenue: money(record.revenue),
        cash: money(record.cashTotal),
        electronic: money(record.electronicTotal),
        fee: money(record.feeTotal),
        net: money(record.netRevenue || record.revenue),
        productCost: Number.isFinite(Number(record.productCostTotal))
            ? Number(record.productCostTotal)
            : calculateProductCost(record.itemTotals || {}, record.orders || []),
        itemTotals: record.itemTotals || {},
        orders: record.orders || []
    };
}

function updateReportRevenueFields(stats) {
    document.getElementById("rev").innerText = money(stats.revenue);
    document.getElementById("cashTotal").innerText = money(stats.cash);
    document.getElementById("electronicTotal").innerText = money(stats.electronic);
    document.getElementById("feeTotal").innerText = money(stats.fee);
    document.getElementById("netRevenue").innerText = money(stats.net);
    document.getElementById("productCostTotal").innerText = money(stats.productCost);
}

function setPayment(method) {
    selectedPayment = method;
    document.getElementById("payCash").classList.toggle("active", method === "cash");
    document.getElementById("payElectronic").classList.toggle("active", method === "electronic");
}

function setPriceMode(price) {
    selectedPrice = Number(price) || 50;
    document.getElementById("price50").classList.toggle("active", selectedPrice === 50);
    document.getElementById("price60").classList.toggle("active", selectedPrice === 60);
    renderProducts();
}

function renderProducts() {
    document.getElementById("productGrid").innerHTML = PRODUCTS.map(name => {
        let safeName = escapeHtml(name);
        let jsName = escapeHtml(JSON.stringify(name));
        return `<button class="item-btn" onclick='addToCart(${jsName})'>${safeName}<br>$${selectedPrice}</button>`;
    }).join("");
}

function addToCart(name) {
    if (!cart[name]) {
        cart[name] = { qty: 0, price: selectedPrice, cost: getProductCost(name) };
    }
    cart[name].qty += 1;
    cart[name].price = selectedPrice;
    cart[name].cost = getProductCost(name);
    renderCart();
}

function changeQty(name, delta) {
    if (!cart[name]) return;

    cart[name].qty += delta;
    if (cart[name].qty <= 0) {
        delete cart[name];
    }
    renderCart();
}

function removeItem(name) {
    delete cart[name];
    renderCart();
}

function renderCart() {
    let html = "";
    cartTotal = 0;

    for (let k in cart) {
        let item = cart[k];
        let sub = item.qty * item.price;
        let safeName = escapeHtml(k);
        let jsName = escapeHtml(JSON.stringify(k));
        cartTotal += sub;

        html += `
        <div class="order">
            <span>${safeName} x${item.qty} = ${sub}</span>
            <div class="order-actions">
                <button onclick='changeQty(${jsName},-1)'>-</button>
                <button onclick='changeQty(${jsName},1)'>+</button>
                <button class="remove" onclick='removeItem(${jsName})'>刪</button>
            </div>
        </div>`;
    }

    if (html === "") {
        html = '<p class="empty">尚未加入商品</p>';
    }

    document.getElementById("cart").innerHTML = html;
    document.getElementById("cartTotal").innerText = cartTotal;
}

function clearCart() {
    cart = {};
    cartTotal = 0;
    renderCart();
}

function getTodayOrders() {
    return JSON.parse(localStorage.getItem(getOrdersKey()) || "[]");
}

function hasTodayOrdersRecord() {
    return localStorage.getItem(getOrdersKey()) !== null;
}

function setTodayOrders(orders) {
    localStorage.setItem(getOrdersKey(), JSON.stringify(orders));
    updateDayFromOrders();
}

function checkout() {
    if (cartTotal === 0) {
        alert("沒有商品");
        return;
    }

    let order = {
        id: Date.now(),
        items: cloneCart(cart),
        total: cartTotal,
        paymentMethod: selectedPayment,
        fee: selectedPayment === "electronic" ? money(cartTotal * ELECTRONIC_FEE_RATE) : 0,
        createdAt: new Date().toISOString()
    };

    let orders = getTodayOrders();
    orders.push(order);
    setTodayOrders(orders);
    clearCart();
    renderTodayStats();
    calcAll();
}

function editLastOrder() {
    let orders = getTodayOrders();
    if (!orders.length) {
        alert("目前沒有上一筆結帳");
        return;
    }

    if (cartTotal > 0 && !confirm("目前本單有商品，修改上一單會覆蓋本單。確定繼續？")) {
        return;
    }

    let order = orders.pop();
    setTodayOrders(orders);
    cart = cloneCart(order.items || {});
    setPayment(order.paymentMethod || "cash");
    renderCart();
    renderTodayStats();
    calcAll();
    show("sale");
}

function deleteLastOrder() {
    let orders = getTodayOrders();
    if (!orders.length) {
        alert("目前沒有上一筆結帳");
        return;
    }

    if (!confirm("確定刪除上一筆結帳？")) {
        return;
    }

    orders.pop();
    setTodayOrders(orders);
    renderTodayStats();
    calcAll();
}

function getTodayStats() {
    let orders = getTodayOrders();
    let stats = {
        revenue: 0,
        cash: 0,
        electronic: 0,
        fee: 0,
        net: 0,
        productCost: 0,
        itemTotals: {},
        orders
    };

    if (!orders.length && !hasTodayOrdersRecord()) {
        let legacyRevenue = Number(localStorage.getItem(getTodayKey())) || 0;
        if (legacyRevenue) {
            stats.revenue = legacyRevenue;
            stats.cash = legacyRevenue;
            stats.net = legacyRevenue;
        }
    }

    orders.forEach(order => {
        let total = money(order.total);
        let fee = Number.isFinite(Number(order.fee)) ? money(order.fee) : getOrderFee(order);
        stats.revenue += total;
        stats.fee += fee;

        if (order.paymentMethod === "electronic") {
            stats.electronic += total;
        } else {
            stats.cash += total;
        }

        for (let name in order.items || {}) {
            let item = order.items[name];
            if (!stats.itemTotals[name]) {
                stats.itemTotals[name] = { qty: 0, total: 0, cost: 0 };
            }
            stats.itemTotals[name].qty += Number(item.qty) || 0;
            stats.itemTotals[name].total += (Number(item.qty) || 0) * (Number(item.price) || 0);
            stats.itemTotals[name].cost += (Number(item.qty) || 0) * (Number.isFinite(Number(item.cost)) ? Number(item.cost) : getProductCost(name));
        }
    });

    stats.productCost = Object.values(stats.itemTotals).reduce((sum, item) => sum + (Number(item.cost) || 0), 0);
    stats.net = stats.revenue - stats.fee;
    return stats;
}

function updateDayFromOrders() {
    dayTotal = getTodayStats().revenue;
    localStorage.setItem(getTodayKey(), String(dayTotal));
    updateRevenue();
}

function updateRevenue() {
    document.getElementById("dayTotal").innerText = dayTotal;
    updateReportRevenueFields(getReportStatsForDate(document.getElementById("date").value));
}

function renderTodayStats() {
    let stats = getTodayStats();
    dayTotal = stats.revenue;
    localStorage.setItem(getTodayKey(), String(dayTotal));
    updateRevenue();

    document.getElementById("cashTotal").innerText = money(stats.cash);
    document.getElementById("electronicTotal").innerText = money(stats.electronic);
    document.getElementById("feeTotal").innerText = money(stats.fee);
    document.getElementById("netRevenue").innerText = money(stats.net);
    document.getElementById("productCostTotal").innerText = money(stats.productCost);

    document.getElementById("paymentSummary").innerHTML = `
        <div class="summary-row"><span>現金</span><strong>$${money(stats.cash)}</strong></div>
        <div class="summary-row"><span>電子支付</span><strong>$${money(stats.electronic)}</strong></div>
        <div class="summary-row"><span>手續費</span><strong>-$${money(stats.fee)}</strong></div>
        <div class="summary-row"><span>實收</span><strong>$${money(stats.net)}</strong></div>
    `;

    let itemHtml = "";
    Object.keys(stats.itemTotals).forEach(name => {
        let item = stats.itemTotals[name];
        itemHtml += `<div class="summary-row"><span>${escapeHtml(name)} x${item.qty}</span><strong>$${money(item.total)} / 成本 $${money(item.cost)}</strong></div>`;
    });
    document.getElementById("salesSummary").innerHTML = itemHtml || '<p class="empty">尚無銷售</p>';

    let last = stats.orders[stats.orders.length - 1];
    if (!last) {
        document.getElementById("lastOrder").innerHTML = '<p class="empty">尚無上一筆結帳</p>';
        return;
    }

    let lines = "";
    for (let name in last.items || {}) {
        let item = last.items[name];
        lines += `<div class="summary-row"><span>${escapeHtml(name)} x${item.qty}</span><strong>$${money(item.qty * item.price)}</strong></div>`;
    }

    document.getElementById("lastOrder").innerHTML = `
        ${lines}
        <div class="summary-row"><span>${getPaymentLabel(last.paymentMethod)}</span><strong>$${money(last.total)}</strong></div>
        <div class="summary-row"><span>手續費</span><strong>-$${money(last.fee || 0)}</strong></div>
        <div class="last-order-actions">
            <button class="btn" onclick="editLastOrder()">修改上一單</button>
            <button class="btn secondary" onclick="deleteLastOrder()">刪除上一單</button>
        </div>
    `;
}

function addFood(name = "", amount = "") {
    let id = Date.now() + Math.floor(Math.random() * 1000);
    let row = document.createElement("div");
    row.id = "food-" + id;
    row.className = "food-row";
    row.innerHTML = `
        <input placeholder="品項" value="${escapeHtml(name)}">
        <input type="number" inputmode="numeric" placeholder="金額" value="${escapeHtml(amount)}" oninput="calcAll()">
        <button onclick="removeFood(${id})">刪</button>
    `;

    document.getElementById("foodList").appendChild(row);
}

function clearFoodList() {
    document.getElementById("foodList").innerHTML = "";
}

function resetReportForm() {
    editingReportDate = "";
    clearFoodList();
    document.getElementById("staff").value = "";
    document.getElementById("rent").value = "";
    document.getElementById("other").value = "";
    document.getElementById("date").value = getTodayString();
    updateReportRevenueFields(getReportStatsForDate(getTodayString()));
    calcAll();
}

function removeFood(id) {
    let row = document.getElementById("food-" + id);
    if (row) row.remove();
    calcAll();
}

function calcFoodTotal() {
    let total = 0;

    document.querySelectorAll("#foodList input[type=number]").forEach(i => {
        total += Number(i.value) || 0;
    });

    document.getElementById("foodTotal").innerText = total;
    return total;
}

function getReportCostSummary(stats) {
    let food = calcFoodTotal();
    let staffVal = Number(document.getElementById("staff").value) || 0;
    let rentVal = Number(document.getElementById("rent").value) || 0;
    let otherVal = Number(document.getElementById("other").value) || 0;
    let fee = Number(stats && stats.fee) || 0;
    let productCost = Number(stats && stats.productCost) || 0;
    let operatingCost = productCost + food + staffVal + rentVal + otherVal;

    return {
        productCost,
        food,
        staff: staffVal,
        rent: rentVal,
        other: otherVal,
        fee,
        operatingCost,
        totalCost: operatingCost + fee,
        profit: (Number(stats && stats.net) || 0) - operatingCost
    };
}

function calcAll() {
    let reportStats = getReportStatsForDate(document.getElementById("date").value);
    let costs = getReportCostSummary(reportStats);

    let kpis = [
        costs.food ? costs.food / 0.25 : 0,
        costs.staff ? costs.staff / 0.2 : 0,
        costs.rent ? costs.rent / 0.1 : 0,
        costs.other ? costs.other / 0.1 : 0
    ];

    let max = Math.max(...kpis);
    let diff = reportStats.revenue - max;

    updateReportRevenueFields(reportStats);
    document.getElementById("totalCost").innerText = money(costs.totalCost);
    document.getElementById("profit").innerText = money(costs.profit);
    document.getElementById("kpi").innerText = money(max);
    document.getElementById("diff").innerText = money(diff);
}

function getFoodItems() {
    let rows = [];
    document.querySelectorAll("#foodList .food-row").forEach(row => {
        let inputs = row.querySelectorAll("input");
        let name = inputs[0].value.trim();
        let amount = Number(inputs[1].value) || 0;

        if (name || amount) {
            rows.push({ name, amount });
        }
    });
    return rows;
}

function getSales() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
}

function setSales(records) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function save() {
    let date = document.getElementById("date").value;
    if (!date) {
        alert("請選擇日期");
        return;
    }

    calcAll();
    let stats = getReportStatsForDate(date);
    let costs = getReportCostSummary(stats);

    let record = {
        date,
        revenue: stats.revenue,
        cashTotal: stats.cash,
        electronicTotal: stats.electronic,
        feeTotal: stats.fee,
        netRevenue: stats.net,
        productCostTotal: costs.productCost,
        operatingCost: costs.operatingCost,
        totalCost: costs.totalCost,
        profit: costs.profit,
        itemTotals: stats.itemTotals,
        orders: stats.orders,
        foodItems: getFoodItems(),
        foodTotal: money(document.getElementById("foodTotal").innerText),
        staff: Number(document.getElementById("staff").value) || 0,
        rent: Number(document.getElementById("rent").value) || 0,
        other: Number(document.getElementById("other").value) || 0,
        kpi: money(document.getElementById("kpi").innerText),
        diff: money(document.getElementById("diff").innerText),
        savedAt: new Date().toISOString()
    };

    let records = getSales().filter(item => item.date !== date);
    records.push(record);
    records.sort((a, b) => b.date.localeCompare(a.date));
    setSales(records);

    alert("已存到本機");
    editingReportDate = "";
    load();
    show("history");
}

function editReport(date) {
    let record = getSales().find(item => item.date === date);
    if (!record) {
        alert("找不到這筆日結紀錄");
        return;
    }

    editingReportDate = date;
    document.getElementById("date").value = record.date;
    clearFoodList();

    (record.foodItems || []).forEach(item => {
        addFood(item.name || "", item.amount || "");
    });

    document.getElementById("staff").value = record.staff || "";
    document.getElementById("rent").value = record.rent || "";
    document.getElementById("other").value = record.other || "";

    updateReportRevenueFields(getReportStatsForDate(record.date));
    calcAll();
    show("report");
}

function deleteReport(date) {
    if (!confirm(`確定刪除 ${date} 的日結紀錄？`)) {
        return;
    }

    let records = getSales().filter(item => item.date !== date);
    setSales(records);

    if (editingReportDate === date) {
        resetReportForm();
    }

    load();
}

function calculateProductCost(itemTotals, orders = []) {
    if (itemTotals && Object.keys(itemTotals).length) {
        return Object.keys(itemTotals).reduce((sum, name) => {
            let item = itemTotals[name] || {};
            if (Number.isFinite(Number(item.cost))) {
                return sum + Number(item.cost);
            }
            return sum + (Number(item.qty) || 0) * getProductCost(name);
        }, 0);
    }

    return (orders || []).reduce((sum, order) => {
        for (let name in order.items || {}) {
            let item = order.items[name];
            sum += (Number(item.qty) || 0) * (Number.isFinite(Number(item.cost)) ? Number(item.cost) : getProductCost(name));
        }
        return sum;
    }, 0);
}

function renderItemTotals(itemTotals) {
    if (!itemTotals || Object.keys(itemTotals).length === 0) {
        return "無";
    }

    return Object.keys(itemTotals)
        .map(name => `${escapeHtml(name)} x${money(itemTotals[name].qty)}`)
        .join("、");
}

function load() {
    let records = getSales();
    let html = "";

    records.forEach(d => {
        let foodText = d.foodItems && d.foodItems.length
            ? d.foodItems.map(item => `${escapeHtml(item.name || "未命名")} $${money(item.amount)}`).join("、")
            : "無";
        let productCost = Number.isFinite(Number(d.productCostTotal))
            ? Number(d.productCostTotal)
            : calculateProductCost(d.itemTotals, d.orders);
        let legacyTotalCost = productCost + (Number(d.foodTotal) || 0) + (Number(d.staff) || 0) + (Number(d.rent) || 0) + (Number(d.other) || 0) + (Number(d.feeTotal) || 0);
        let legacyProfit = (Number(d.netRevenue || d.revenue) || 0) - productCost - (Number(d.foodTotal) || 0) - (Number(d.staff) || 0) - (Number(d.rent) || 0) - (Number(d.other) || 0);

        html += `
        <div class="history-card">
            <h3>${escapeHtml(d.date)}</h3>
            <p>營收：$${money(d.revenue)}</p>
            <p>現金：$${money(d.cashTotal)}｜電子支付：$${money(d.electronicTotal)}</p>
            <p>電子支付手續費：$${money(d.feeTotal)}｜實收：$${money(d.netRevenue || d.revenue)}</p>
            <p>商品成本：$${money(productCost)}</p>
            <p>總成本：$${money(Number.isFinite(Number(d.totalCost)) ? d.totalCost : legacyTotalCost)}</p>
            <p>所得：$${money(Number.isFinite(Number(d.profit)) ? d.profit : legacyProfit)}</p>
            <p>商品銷售：${renderItemTotals(d.itemTotals)}</p>
            <p>食材：${foodText}</p>
            <p>額外成本：$${money(d.foodTotal)}</p>
            <p>人事：$${money(d.staff)}｜租金：$${money(d.rent)}｜管銷：$${money(d.other)}</p>
            <p>KPI：$${money(d.kpi)}</p>
            <p>差額：$${money(d.diff)}</p>
            <div class="history-actions">
                <button class="btn" onclick="editReport('${escapeHtml(d.date)}')">修改</button>
                <button class="btn secondary" onclick="deleteReport('${escapeHtml(d.date)}')">刪除</button>
            </div>
        </div>`;
    });

    if (html === "") {
        html = '<p class="empty">尚無歷史紀錄</p>';
    }

    document.getElementById("list").innerHTML = html;
}

document.addEventListener("input", calcAll);
document.getElementById("date").addEventListener("change", calcAll);
document.getElementById("date").valueAsDate = new Date();

if (!hasTodayOrdersRecord() && Number(localStorage.getItem(getTodayKey()))) {
    dayTotal = Number(localStorage.getItem(getTodayKey())) || 0;
} else {
    dayTotal = getTodayStats().revenue;
}

renderCart();
setPayment("cash");
setPriceMode(50);
renderTodayStats();
calcAll();
load();
</script>
</body>
</html>
